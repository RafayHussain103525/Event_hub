services:
  backend:
    build: ./backend
    ports:
      - "8000:80"
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: